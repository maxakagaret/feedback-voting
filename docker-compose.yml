name: feedback-voting

# No queue worker or scheduler: everything in this app is a short synchronous request.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: feedback-voting-php
    environment:
      BOOTSTRAP: "1"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/storage/framework/ready"]
      interval: 5s
      retries: 60

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8083:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://nginx
    ports:
      - "5176:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: feedback
      MYSQL_USER: feedback
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 30
    volumes:
      - mysql_data:/var/lib/mysql

  # Cache store (login and idea rate limiters).
  redis:
    image: redis:7-alpine

volumes:
  mysql_data:
  frontend_node_modules:
